services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-server
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION:-1.21.4}"
      MEMORY: "${MC_MEMORY:-6G}"
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: "10"
      MOTD: "Servidor Oficial"
      OPS: "${MC_OPS:-}"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
    volumes:
      - ./data:/data
    restart: unless-stopped